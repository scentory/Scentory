<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Hawas Rouge EDP image coming soon</title>
  <desc id="desc">Neutral Scentory catalogue placeholder for an out-of-stock perfume.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="0.55" stop-color="#221117"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#8a2438" stop-opacity=".6"/>
      <stop offset="1" stop-color="#8a2438" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".16">
    <circle cx="600" cy="470" r="250"/>
    <circle cx="600" cy="470" r="315"/>
  </g>
  <text x="600" y="190" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="48" letter-spacing="16" text-anchor="middle">SCENTORY</text>
  <text x="600" y="520" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="5" text-anchor="middle">HAWAS ROUGE</text>
  <text x="600" y="590" fill="#e2c9ce" font-family="Arial, Helvetica, sans-serif" font-size="34" letter-spacing="10" text-anchor="middle">EDP</text>
  <rect x="395" y="690" width="410" height="82" rx="41" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".28"/>
  <text x="600" y="744" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="27" letter-spacing="4" text-anchor="middle">OUT OF STOCK</text>
  <text x="600" y="1020" fill="#fff" fill-opacity=".62" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="3" text-anchor="middle">PRODUCT IMAGE COMING SOON</text>
</svg>
